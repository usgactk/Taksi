<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="TaksiPRO"/>
<title>🚕 TaksiPRO</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#fff;font-family:'Syne',sans-serif;color:#111;}
.mono{font-family:'JetBrains Mono',monospace;}
input,select,button{font-family:'Syne',sans-serif;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#e5e5e5;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#111;cursor:pointer;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px;}

/* Layout */
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;}
.header{padding:16px 14px 12px;border-bottom:1px solid #e5e5e5;background:#fff;position:sticky;top:0;z-index:20;}
.header.gece{background:#111;border-color:#333;}
.logo{font-size:20px;font-weight:800;letter-spacing:-0.5px;}
.plaka-badge{font-size:11px;color:#888;margin-top:2px;font-family:'JetBrains Mono',monospace;}
.header.gece .plaka-badge{color:#666;}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.vardiya-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #ddd;border-radius:8px;padding:6px 12px;cursor:pointer;background:#f5f5f5;font-size:10px;color:#666;}
.header.gece .vardiya-btn{background:#222;border-color:#444;color:#aaa;}
.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mini-stat{text-align:center;padding:8px 4px;background:#f5f5f5;border-radius:8px;border:1px solid #e0e0e0;}
.mini-stat.gece{background:#222;border-color:#333;}
.mini-stat-val{font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.mini-stat-lbl{font-size:10px;color:#999;margin-top:1px;}
.mini-stat.gece .mini-stat-lbl{color:#555;}

/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #111;position:sticky;top:72px;z-index:19;}
.tab-btn{flex:1;background:none;border:none;color:#aaa;padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-family:'Syne',sans-serif;}
.tab-btn.active{color:#111;border-bottom:2px solid #111;margin-bottom:-2px;}
.tab-icon{font-size:18px;}

/* Content */
.content{padding:14px 12px;background:#fff;min-height:calc(100vh - 140px);}

/* Section */
.sec-title{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.action-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

/* Buttons */
.btn-primary{background:#111;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;}
.btn-save{width:100%;background:#111;color:#fff;border:none;border-radius:9px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;margin-top:4px;}
.btn-del{background:#fee2e2;border:none;border-radius:5px;color:#dc2626;padding:3px 7px;font-size:12px;cursor:pointer;}
.btn-seg{flex:1;background:#f0f0f0;border:1px solid #ddd;border-radius:7px;color:#888;padding:8px;font-size:13px;cursor:pointer;font-family:'Syne',sans-serif;}
.btn-seg.active{background:#111;border-color:#111;color:#fff;}
.segmented{display:flex;gap:8px;margin-bottom:10px;}

/* Cards */
.card{background:#fafafa;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.form-card{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin-bottom:12px;}
.km-card{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:10px;padding:10px;margin-bottom:12px;}
.yov-card{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.hesap-card{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.stat-box{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:10px;padding:14px 12px;text-align:center;}
.chart-card{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:10px;padding:12px;margin-bottom:10px;}

/* Form */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-group{margin-bottom:10px;}
.label{font-size:11px;color:#777;margin-bottom:4px;font-weight:600;display:block;}
.input{width:100%;background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 10px;color:#111;font-size:14px;outline:none;font-family:'Syne',sans-serif;}
.select{width:100%;background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 10px;color:#111;font-size:13px;outline:none;}
.km-input{width:100%;background:#fff;border:1px solid #ddd;border-radius:6px;padding:7px 8px;color:#111;font-size:13px;font-family:'JetBrains Mono',monospace;}

/* Sefer card */
.sefer-no{background:#111;color:#fff;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;min-width:30px;text-align:center;}
.sefer-saat{color:#888;font-size:12px;font-family:'JetBrains Mono',monospace;}
.sefer-tutar{color:#111;font-weight:800;font-size:15px;font-family:'JetBrains Mono',monospace;}
.badge-nakit{background:#111;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;}
.badge-kart{background:#f0f0f0;color:#333;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;border:1px solid #ddd;}
.sefer-acik{color:#999;font-size:11px;margin-top:3px;}
.sefer-km{color:#555;font-size:10px;margin-top:2px;font-family:'JetBrains Mono',monospace;}

/* Hesap */
.h-row{display:flex;justify-content:space-between;padding:6px 0;}
.h-row .lbl{font-size:13px;color:#94a3b8;}
.h-row .val{font-size:13px;font-weight:500;font-family:'JetBrains Mono',monospace;}
.h-row.bold .lbl{font-size:14px;color:#111;font-weight:700;}
.h-row.bold .val{font-size:15px;font-weight:800;}
.hr{border-top:1px solid #e5e5e5;margin:6px 0;}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pay-box{background:#fafafa;border-radius:12px;padding:14px 10px;text-align:center;border:1px solid #e5e5e5;}
.nakit-kutu{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:10px;padding:12px 14px;margin-bottom:12px;}

/* Gider emoji */
.gider-emoji{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* tip buttons */
.tip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.tip-btn{background:#f0f0f0;border:1px solid #ddd;border-radius:7px;color:#555;padding:9px;font-size:13px;cursor:pointer;font-family:'Syne',sans-serif;}

/* Borc */
.borc-item{background:#fafafa;border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:#fff;border-radius:16px 16px 0 0;padding:0 14px 24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;border-bottom:1px solid #e5e5e5;margin-bottom:14px;font-weight:800;font-size:16px;}
.btn-close{background:#f0f0f0;border:none;border-radius:6px;color:#555;padding:5px 10px;cursor:pointer;font-size:14px;}

/* Chart bars */
.bar-wrap{display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;background:#111;min-height:2px;}
.bar-lbl{font-size:9px;color:#999;}
.bar-val{font-size:9px;color:#555;font-family:'JetBrains Mono',monospace;}

/* GPS banner */
.gps-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:12px;}
.empty{text-align:center;color:#aaa;padding:28px 0;font-size:14px;}
.btn-reset{width:100%;background:transparent;border:1px solid #ddd;border-radius:9px;padding:11px;font-size:14px;color:#dc2626;cursor:pointer;font-family:'Syne',sans-serif;}
.profil-sifor-card{display:flex;align-items:center;gap:10px;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin-bottom:7px;background:#fafafa;}

/* Saatler bar */
.saat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.saat-bar-bg{flex:1;background:#e5e5e5;border-radius:4px;height:8px;overflow:hidden;}
.saat-bar-fill{height:100%;background:#111;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="header" class="header">
    <div class="header-row">
      <div>
        <div class="logo" id="logo-text">🚕 TaksiPRO</div>
        <div class="plaka-badge" id="plaka-text">34 ABC 123 · Şoför 1</div>
      </div>
      <button class="vardiya-btn" id="vardiya-btn" onclick="toggleVardiya()">
        <span id="vardiya-icon" style="font-size:16px">☀️</span>
        <span id="vardiya-lbl">Gündüz</span>
      </button>
    </div>
    <div class="mini-stats">
      <div class="mini-stat" id="ms-hasilat"><div class="mini-stat-val" style="color:#16a34a" id="ms-hasilat-val">0,00 ₺</div><div class="mini-stat-lbl">Hasılat</div></div>
      <div class="mini-stat" id="ms-gider"><div class="mini-stat-val" style="color:#dc2626" id="ms-gider-val">0,00 ₺</div><div class="mini-stat-lbl">Gider</div></div>
      <div class="mini-stat" id="ms-net"><div class="mini-stat-val" id="ms-net-val">0,00 ₺</div><div class="mini-stat-lbl">Net</div></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" onclick="setTab('isler')" id="tab-isler"><span class="tab-icon">🚕</span>İşler</button>
    <button class="tab-btn" onclick="setTab('giderler')" id="tab-giderler"><span class="tab-icon">💸</span>Giderler</button>
    <button class="tab-btn" onclick="setTab('rapor')" id="tab-rapor"><span class="tab-icon">📈</span>Rapor</button>
    <button class="tab-btn" onclick="setTab('hesap')" id="tab-hesap"><span class="tab-icon">🧾</span>Hesap</button>
    <button class="tab-btn" onclick="setTab('profil')" id="tab-profil"><span class="tab-icon">⚙️</span>Profil</button>
  </div>

  <div class="content" id="content"></div>
</div>

<!-- Modals -->
<div class="overlay" id="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
const KEY = 'taksipro_v3';
let S = load();

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d) return d;
  } catch(e) {}
  return {
    profile: { plaka:'34 ABC 123', malSahipOran:50, yovmiyeOran:10, siforler:[{id:1,ad:'Şoför 1',tel:''}], aktifSifor:1 },
    seferler: [], giderler: [], borclar: [],
    vardiya: 'gunduz', baslKm:'', bitisKm:''
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

// ── UTILS ──────────────────────────────────────────────────────────────────────
function tl(v) {
  return (parseFloat(v)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
}
function simdi() { return new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function bugun() { return new Date().toISOString().split('T')[0]; }
function aktifSifor() { return S.profile.siforler.find(s=>s.id===S.profile.aktifSifor)||S.profile.siforler[0]; }

function bugunSeferler() { return S.seferler.filter(s=>s.tarih===bugun()&&s.siforId===S.profile.aktifSifor); }
function bugunGiderler() { return S.giderler.filter(g=>g.tarih===bugun()&&g.siforId===S.profile.aktifSifor); }

function hesapla() {
  const bs = bugunSeferler(), bg = bugunGiderler();
  const hasilat = bs.reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
  const gider   = bg.reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
  const yovmiye = hasilat*(S.profile.yovmiyeOran/100);
  const net     = hasilat-gider-yovmiye;
  const malPay  = net>0?net*(S.profile.malSahipOran/100):0;
  const siforPay= net>0?net-malPay:0;
  const nakit   = bs.filter(s=>s.odeme==='nakit').reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
  const kart    = bs.filter(s=>s.odeme==='kart').reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
  return {hasilat,gider,yovmiye,net,malPay,siforPay,nakit,kart};
}

// ── TAB STATE ─────────────────────────────────────────────────────────────────
let activeTab = 'isler';
let raporPeriyot = 'gunluk';

function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  render();
}

// ── VARDIYA ───────────────────────────────────────────────────────────────────
function toggleVardiya() {
  S.vardiya = S.vardiya==='gunduz'?'gece':'gunduz';
  save(); updateHeader();
}
function updateHeader() {
  const gece = S.vardiya==='gece';
  const hdr = document.getElementById('header');
  hdr.className = 'header'+(gece?' gece':'');
  document.getElementById('vardiya-icon').textContent = gece?'🌙':'☀️';
  document.getElementById('vardiya-lbl').textContent = gece?'Gece':'Gündüz';
  document.getElementById('logo-text').style.color = gece?'#fff':'#111';
  document.getElementById('plaka-text').textContent = (S.profile.plaka||'')+ ' · '+(aktifSifor()?.ad||'');
  document.querySelectorAll('.mini-stat').forEach(el=>{
    el.className='mini-stat'+(gece?' gece':'');
  });
  const h=hesapla();
  document.getElementById('ms-hasilat-val').textContent=tl(h.hasilat);
  document.getElementById('ms-gider-val').textContent=tl(h.gider+h.yovmiye);
  document.getElementById('ms-net-val').textContent=tl(h.net);
  document.getElementById('ms-net-val').style.color=gece?'#fff':'#111';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  updateHeader();
  const c = document.getElementById('content');
  if (activeTab==='isler')    c.innerHTML = renderIsler();
  if (activeTab==='giderler') c.innerHTML = renderGiderler();
  if (activeTab==='rapor')    c.innerHTML = renderRapor();
  if (activeTab==='hesap')    c.innerHTML = renderHesap();
  if (activeTab==='profil')   c.innerHTML = renderProfil();
}

// ── İŞLER ─────────────────────────────────────────────────────────────────────
let gpsWatch=null, gpsAktif=false;

function renderIsler() {
  const bs = bugunSeferler();
  const top = bs.reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
  const mes = (S.baslKm&&S.bitisKm)?(parseFloat(S.bitisKm)-parseFloat(S.baslKm)).toFixed(0)+' km':'— km';
  return `
  <div class="action-row">
    <div><div class="sec-title">Bugünkü Seferler</div>
      <div style="font-size:11px;color:#999">${bs.length} sefer · ${tl(top)}</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn-primary" style="background:${gpsAktif?'#16a34a':'#111'};font-size:12px" onclick="toggleGps()">
        📍 ${gpsAktif?'Aktif':'GPS'}
      </button>
      <button class="btn-primary" onclick="openSeferModal()">+ Sefer</button>
    </div>
  </div>
  <div class="km-card">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><div class="label">🔑 Başlangıç KM</div>
        <input class="km-input" type="number" placeholder="000000" value="${S.baslKm||''}" oninput="S.baslKm=this.value;save();document.getElementById('km-mes').textContent=getKmMes()"/></div>
      <div style="flex:1"><div class="label">🏁 Bitiş KM</div>
        <input class="km-input" type="number" placeholder="000000" value="${S.bitisKm||''}" oninput="S.bitisKm=this.value;save();document.getElementById('km-mes').textContent=getKmMes()"/></div>
      <div style="flex:1"><div class="label">📏 Mesafe</div>
        <div class="km-input" id="km-mes" style="color:#111;font-weight:700;display:flex;align-items:center">${mes}</div></div>
    </div>
  </div>
  ${bs.length===0?'<div class="empty">Henüz sefer yok</div>':''}
  ${[...bs].reverse().map((s,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:10px">
      <div class="sefer-no">#${bs.length-i}</div>
      <div style="flex:1">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span class="sefer-saat">${s.saat||''}</span>
          <span class="${s.odeme==='nakit'?'badge-nakit':'badge-kart'}">${s.odeme==='nakit'?'💵 Nakit':'💳 Kart'}</span>
        </div>
        ${s.aciklama?`<div class="sefer-acik">${s.aciklama}</div>`:''}
        ${(s.baslKm||s.bitisKm)?`<div class="sefer-km">${s.baslKm||'?'} → ${s.bitisKm||'?'} km</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div class="sefer-tutar">${tl(s.tutar)}</div>
        <button class="btn-del" onclick="silSefer('${s.id}')">✕</button>
      </div>
    </div>`).join('')}`;
}

function getKmMes() {
  return (S.baslKm&&S.bitisKm)?(parseFloat(S.bitisKm)-parseFloat(S.baslKm)).toFixed(0)+' km':'— km';
}

function silSefer(id) { S.seferler=S.seferler.filter(s=>String(s.id)!==String(id)); save(); render(); }

function toggleGps() {
  if (!gpsAktif) {
    if (!navigator.geolocation){alert('GPS desteklenmiyor');return;}
    gpsWatch = navigator.geolocation.watchPosition(p=>{
      S.rotaGecmisi = [...((S.rotaGecmisi||[]).slice(-99)),{lat:p.coords.latitude,lng:p.coords.longitude,t:simdi()}];
      save();
    },()=>{},{enableHighAccuracy:true});
    gpsAktif=true;
  } else {
    if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
    gpsAktif=false;
  }
  render();
}

// ── GİDERLER ──────────────────────────────────────────────────────────────────
const GIDER_TIPS = {
  yakit:{label:'Yakıt',emoji:'⛽',color:'#f97316'},
  yemek:{label:'Yemek',emoji:'🍽️',color:'#16a34a'},
  masraf:{label:'Masraf',emoji:'🔧',color:'#ef4444'},
  diger:{label:'Diğer',emoji:'📦',color:'#8b5cf6'}
};
let borcShow=false;

function renderGiderler() {
  const bg=bugunGiderler();
  const h=hesapla();
  const borclar=S.borclar||[];
  const aktif=borclar.filter(b=>!b.odendi);
  return `
  <div class="action-row">
    <div><div class="sec-title">Giderler</div>
      <div style="font-size:11px;color:#999">${bg.length} kalem</div></div>
    <button class="btn-primary" onclick="openGiderModal()">+ Gider</button>
  </div>
  <div class="yov-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="color:#7c3aed;font-size:13px;font-weight:700">👷 Yövmiye (Cironun %${S.profile.yovmiyeOran})</div>
        <div style="color:#999;font-size:11px;margin-top:2px">Ciro: ${tl(h.hasilat)}</div>
      </div>
      <div style="color:#7c3aed;font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace">${tl(h.yovmiye)}</div>
    </div>
  </div>
  ${bg.length===0?'<div class="empty">Henüz gider yok</div>':''}
  ${[...bg].reverse().map(g=>{
    const tip=GIDER_TIPS[g.tip]||GIDER_TIPS.diger;
    return `<div class="card" style="display:flex;align-items:center;gap:10px">
      <div class="gider-emoji" style="background:${tip.color}22">${tip.emoji}</div>
      <div style="flex:1">
        <div style="color:${tip.color};font-size:13px;font-weight:700">${tip.label}</div>
        ${g.aciklama?`<div class="sefer-acik">${g.aciklama}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div style="color:#dc2626;font-weight:800;font-family:'JetBrains Mono',monospace">-${tl(g.tutar)}</div>
        <button class="btn-del" onclick="silGider('${g.id}')">✕</button>
      </div>
    </div>`;
  }).join('')}

function toggleBorcForm(){borcShow=!borcShow;render();}
function borcEkle(){
  const kisi=document.getElementById('borc-kisi').value.trim();
  const tutar=document.getElementById('borc-tutar').value;
  if(!kisi||!tutar)return;
  S.borclar=[...(S.borclar||[]),{id:Date.now(),tip:document.getElementById('borc-tip').value,kisi,tutar,aciklama:document.getElementById('borc-not').value,tarih:bugun(),odendi:false}];
  borcShow=false;save();render();
}
function borcOdendi(id){S.borclar=S.borclar.map(b=>String(b.id)===String(id)?{...b,odendi:!b.odendi}:b);save();render();}
function borcSil(id){S.borclar=S.borclar.filter(b=>String(b.id)!==String(id));save();render();}

// ── RAPOR ──────────────────────────────────────────────────────────────────────
const AYLAR=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

function gunHasilat(iso){
  return S.seferler.filter(s=>s.tarih===iso).reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
}

function renderRapor(){
  // Son 7 gün
  const gun7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(6-i));
    const iso=d.toISOString().split('T')[0];
    const h=gunHasilat(iso);
    const lbl=GUNLER[d.getDay()===0?6:d.getDay()-1];
    return {lbl,h,iso};
  });
  // Son 6 ay
  const ay6=Array.from({length:6},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-(5-i));
    const ay=d.getMonth(),yil=d.getFullYear();
    const h=S.seferler.filter(s=>{const sd=new Date(s.tarih);return sd.getMonth()===ay&&sd.getFullYear()===yil;}).reduce((t,x)=>t+(parseFloat(x.tutar)||0),0);
    return {lbl:AYLAR[ay],h};
  });

  const data = raporPeriyot==='gunluk'?gun7:ay6;
  const maxH = Math.max(...data.map(d=>d.h),1);

  // En yoğun saatler
  const saatler=Array.from({length:24},(_,h)=>({saat:`${h}:00`,count:S.seferler.filter(s=>parseInt((s.saat||'0').split(':')[0])===h).length})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5);

  // Ortalama
  const gunSet=[...new Set(S.seferler.map(s=>s.tarih))];
  const ortGun=gunSet.length>0?S.seferler.reduce((t,x)=>t+(parseFloat(x.tutar)||0),0)/gunSet.length:0;

  return `
  <div class="action-row">
    <div class="sec-title">Raporlar</div>
    <button class="btn-primary" style="font-size:12px" onclick="pdfRapor()">📄 PDF</button>
  </div>
  <div class="row2" style="margin-bottom:12px">
    <div class="stat-box">
      <div style="font-size:17px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#111">${tl(ortGun)}</div>
      <div style="font-size:11px;color:#999;margin-top:4px">Ort. Günlük Gelir</div>
    </div>
    <div class="stat-box">
      <div style="font-size:22px;font-weight:800;color:#111">${S.seferler.length}</div>
      <div style="font-size:11px;color:#999;margin-top:4px">Toplam Sefer</div>
    </div>
  </div>
  <div class="segmented">
    <button class="btn-seg ${raporPeriyot==='gunluk'?'active':''}" onclick="setPeriyot('gunluk')">Günlük</button>
    <button class="btn-seg ${raporPeriyot==='aylik'?'active':''}" onclick="setPeriyot('aylik')">Aylık</button>
  </div>
  <div class="chart-card">
    <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:10px">💰 Hasılat Grafiği</div>
    <div class="bar-wrap">
      ${data.map((d,i)=>`
        <div class="bar-col">
          <div class="bar-val">${d.h>0?(d.h>=1000?(d.h/1000).toFixed(1)+'k':Math.round(d.h)):'—'}</div>
          <div class="bar-fill" style="height:${Math.max((d.h/maxH)*80,2)}px;background:${i===data.length-1?'#111':'#bbb'}"></div>
          <div class="bar-lbl">${d.lbl}</div>
        </div>`).join('')}
    </div>
  </div>
  ${saatler.length>0?`
  <div class="chart-card">
    <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:10px">⏰ En Yoğun Saatler</div>
    ${saatler.map((s,i)=>`
      <div class="saat-row">
        <div style="font-size:12px;font-family:'JetBrains Mono',monospace;min-width:44px;color:#555">${s.saat}</div>
        <div class="saat-bar-bg"><div class="saat-bar-fill" style="width:${(s.count/saatler[0].count)*100}%;background:${i===0?'#111':'#888'}"></div></div>
        <div style="font-size:12px;color:#999;min-width:20px;text-align:right">${s.count}</div>
      </div>`).join('')}
  </div>`:''}`;
}

function gunSifirla(){
  if(!confirm('Bugünkü tüm veriler silinecek!'))return;
  const t=bugun(),id=S.profile.aktifSifor;
  S.seferler=S.seferler.filter(s=>!(s.tarih===t&&s.siforId===id));
  S.giderler=S.giderler.filter(g=>!(g.tarih===t&&g.siforId===id));
  S.baslKm='';S.bitisKm='';
  save();render();
}

    </div>
    <div class="row2">
      <div><label class="label">Tutar (₺) *</label>
        <input class="input" type="number" inputmode="decimal" placeholder="0.00" id="gd-tutar" autofocus/></div>
      <div><label class="label">Not</label>
        <input class="input" id="gd-not" placeholder="Opsiyonel"/></div>
    </div>
    <button class="btn-save" onclick="giderKaydet()">✓ Kaydet</button>
  `,'💸 Gider Ekle');
  window._giderTip='yakit';
}

function setGiderTip(k){
  window._giderTip=k;
  Object.keys(GIDER_TIPS).forEach(t=>{
    const btn=document.getElementById('tip-'+t);
    if(!btn)return;
    const v=GIDER_TIPS[t];
    if(t===k){btn.style.background=v.color+'22';btn.style.borderColor=v.color;btn.style.color=v.color;}
    else{btn.style.background='#f0f0f0';btn.style.borderColor='#ddd';btn.style.color='#555';}
  });
}

function giderKaydet(){
  const tutar=document.getElementById('gd-tutar').value;
  if(!tutar||parseFloat(tutar)<=0)return;
  S.giderler.push({id:Date.now(),tip:window._giderTip||'yakit',tutar,
    aciklama:document.getElementById('gd-not').value,
    tarih:bugun(),siforId:S.profile.aktifSifor});
  save();closeModal();render();
}

function openSiforModal(){
  openModal(`
    <div class="form-group"><label class="label">Şoför Adı *</label>
      <input class="input" id="si-ad" placeholder="Ad Soyad" autofocus/></div>
    <div class="form-group"><label class="label">Telefon</label>
      <input class="input" id="si-tel" placeholder="05xx xxx xx xx"/></div>
    <button class="btn-save" onclick="siforKaydet()">✓ Kaydet</button>
  `,'🧑‍✈️ Yeni Şoför');
}

function siforKaydet(){
  const ad=document.getElementById('si-ad').value.trim();
  if(!ad)return;
  S.profile.siforler.push({id:Date.now(),ad,tel:document.getElementById('si-tel').value});
  save();closeModal();render();
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
